<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#041a2b">
  <title>Batoid Parameter Atlas</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 6c-3 0-5 3-6.5 5.5C7 15 3 17 2 20c4 0 8-1 11-1l3 10 3-10c3 0 7 1 11 1-1-3-5-5-7.5-8.5C21 9 19 6 16 6z' fill='%235ee6f0'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    } }
  </script>
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <a class="skip" href="#detail">설명으로 건너뛰기</a>
  <header>
    <div class="brand">
      <svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 6c-3 0-5 3-6.5 5.5C7 15 3 17 2 20c4 0 8-1 11-1l3 10 3-10c3 0 7 1 11 1-1-3-5-5-7.5-8.5C21 9 19 6 16 6z" fill="currentColor"/></svg>
      <h1>Batoid Parameter Atlas <small>가오리 신체적 특징 파라미터 41개 · 3D 위치와 범위</small></h1>
    </div>
    <div class="seg" role="group" aria-label="3D 모델">
      <button data-model="manta" aria-pressed="true">만타</button>
      <button data-model="standard" aria-pressed="false">표준 가오리</button>
    </div>
    <button id="sym" class="link">기호표 · 단위</button>
    <a class="link" href="parameter_zip.pdf" target="_blank" rel="noopener">원문 PDF</a>
  </header>
  <main>
    <aside id="list" aria-label="파라미터 목록">
      <div class="search">
        <label for="q" class="sr-only">파라미터 검색</label>
        <input id="q" name="q" type="search" placeholder="파라미터·기호 검색 (예: 코드, AR, DL_pel…)" autocomplete="off" spellcheck="false">
      </div>
      <div id="groups"></div>
    </aside>
    <section id="viewer" aria-label="3D 뷰">
      <div id="canvas"></div>
      <div class="toolbar">
        <div class="seg" role="group" aria-label="시점">
          <button data-view="top">위</button><button data-view="bottom">아래</button><button data-view="side">옆</button><button data-view="front">앞</button><button data-view="iso">3D</button>
        </div>
        <div class="seg" role="group" aria-label="표시">
          <button id="skel" aria-pressed="false">골격</button><button id="lbl" class="on" aria-pressed="true">라벨</button>
        </div>
      </div>
      <div id="note" hidden></div>
      <div id="toast" role="status" aria-live="polite"></div>
      <p id="caption"></p>
      <p class="hint">드래그 회전 · 휠 확대 · 우클릭 이동</p>
    </section>
    <aside id="detail" aria-live="polite" tabindex="-1"></aside>
  </main>
  <dialog id="symbols" aria-labelledby="sym-title">
    <form method="dialog"><button class="close">닫기</button></form>
    <div id="symbols-body"></div>
  </dialog>
</body>
</html>
